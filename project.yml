name: CourseTable
options:
  bundleIdPrefix: com.codex.coursetable
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  CourseTableCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CourseTableCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.coursetable.core
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
  CourseTableApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/WidgetShared/WidgetSchedule.swift
      - path: Sources/CourseTableApp
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Sources/CourseTableApp/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Assets.xcassets
    dependencies:
      - target: CourseTableCore
      - target: CourseTableWidget
        embed: true
    info:
      path: Sources/CourseTableApp/Info.plist
      properties:
        CFBundleDisplayName: 流云课表
        CFBundleName: 流云课表
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: 用于拍摄课程表图片并识别课程与时间。
        NSPhotoLibraryUsageDescription: 用于从相册选择课程表图片进行识别。
        NSCalendarsWriteOnlyAccessUsageDescription: 用于把确认后的课程写入系统日历并设置提醒。
        NSCalendarsFullAccessUsageDescription: 用于更新或删除本应用此前导入的课程日程。
        NSCalendarsUsageDescription: 用于把确认后的课程写入系统日历并设置提醒。
        ITSAppUsesNonExemptEncryption: false
        AIBaseURL: http://43.226.36.44:8317/v1
        AIAPIKey: "123456"
        AIModel: codex/gpt-6-luna
        NSAppTransportSecurity:
          NSExceptionDomains:
            43.226.36.44:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.coursetable.app
        CODE_SIGN_ENTITLEMENTS: Sources/WidgetShared/Shared.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        SWIFT_STRICT_CONCURRENCY: minimal
  CourseTableWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/CourseTableWidget
      - path: Sources/WidgetShared/WidgetSchedule.swift
    info:
      path: Sources/CourseTableWidget/Info.plist
      properties:
        CFBundleDisplayName: 流云课表小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.coursetable.app.widget
        CODE_SIGN_ENTITLEMENTS: Sources/WidgetShared/Shared.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
  CourseTableCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CourseTableCoreTests
    dependencies:
      - target: CourseTableCore
schemes:
  CourseTable:
    build:
      targets:
        CourseTableCore: all
        CourseTableApp: all
        CourseTableCoreTests: [test]
    test:
      targets:
        - CourseTableCoreTests
