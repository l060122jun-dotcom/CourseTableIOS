name: iOS CI

on:
  push:
    branches: [main, master, ios-v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | awk '/^Xcode / {print $2}' | cut -d. -f1)" -ge 26

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Validate privacy manifest
        run: plutil -lint Sources/CourseTableApp/PrivacyInfo.xcprivacy

      - name: Test domain package
        run: swift test

      - name: Build iOS app for simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project CourseTable.xcodeproj \
            -scheme CourseTable \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate app bundle
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleDisplayName|CFBundleIdentifier" || true
