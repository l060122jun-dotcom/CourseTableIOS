name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-14 has the broadest availability for private repositories.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcode-select -p

      - name: Print toolchain
        run: |
          xcodebuild -version
          xcodegen --version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          # Current XcodeGen emits objectVersion 77, which Xcode 15.4 rejects.
          # Keep the generated project otherwise unchanged for the macos-14 runner.
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' CourseTable.xcodeproj/project.pbxproj

      - name: Test domain package
        run: swift test

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project CourseTable.xcodeproj \
            -scheme CourseTable \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-table-simulator-build
          path: build/Build/Products/Debug-iphonesimulator/CourseTableApp.app
          if-no-files-found: error

      - name: Create unsigned App Store archive
        run: |
          xcodebuild archive \
            -project CourseTable.xcodeproj \
            -scheme CourseTable \
            -destination "generic/platform=iOS" \
            -archivePath build/CourseTable.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload archive for signing
        uses: actions/upload-artifact@v4
        with:
          name: course-table-unsigned-archive
          path: build/CourseTable.xcarchive

      - name: Launch simulator and capture effect screen
        run: |
          set -euxo pipefail
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone .* \(' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          test -n "$UDID"
          echo "Using simulator: $UDID"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], timeout=90, check=True)' xcrun simctl boot "$UDID" || true
          sleep 12
          APP=build/Build/Products/Debug-iphonesimulator/CourseTableApp.app
          test -n "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], timeout=90, check=True)' xcrun simctl install "$UDID" "$APP"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], timeout=60, check=True)' xcrun simctl launch "$UDID" com.codex.coursetable.app
          sleep 3
          mkdir -p artifacts
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], timeout=60, check=True)' xcrun simctl io "$UDID" screenshot artifacts/course-table.png

      - name: Upload effect screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-table-effect
          path: artifacts/course-table.png
